name: Apply Fogram chat access restrictions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-restrictions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'eiwosq/fogram'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch and test policy
        shell: bash
        run: |
          set -euo pipefail
          if test -f Telegram/SourceFiles/core/channel_guard.h; then
            echo "Fogram restrictions are already applied."
            exit 0
          fi
          git apply --check patches/unjoined-chats.patch
          git apply patches/unjoined-chats.patch
          g++ -std=c++20 -Wall -Wextra -Werror -ITelegram/SourceFiles \
            Telegram/Tests/channel_guard_policy_test.cpp -o /tmp/channel_guard_policy_test
          /tmp/channel_guard_policy_test
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add FORK_README.md configure_fork_windows.cmd Telegram/SourceFiles Telegram/Tests
          git commit -m "Add independent restrictions for unjoined channels and groups"
          git push origin HEAD:main
